<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App demo GitHub Pages</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 480px;
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; }
  p { color: #94a3b8; line-height: 1.6; }
  .count-btn {
    margin-top: 24px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  .count-btn:hover { background: #0ea5e9; }
  #count { font-weight: 700; color: #38bdf8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 App demo trên GitHub Pages</h1>
    <p>Đây là ứng dụng web tĩnh đơn giản, được đẩy lên GitHub và tự động triển khai bằng GitHub Pages.</p>
    <p>Đã bấm: <span id="count">0</span> lần</p>
    <button class="count-btn" onclick="document.getElementById('count').innerText = +document.getElementById('count').innerText + 1">Bấm thử</button>
  </div>
</body>
</html>
